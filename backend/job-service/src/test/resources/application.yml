# Test-only configuration: use in-memory H2 so unit/integration tests
# run hermetically on CI without a live PostgreSQL server.
# (This file shadows src/main/resources/application.yml on the test classpath.)
spring:
  application:
    name: job-service
  datasource:
    url: jdbc:h2:mem:jobdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

eureka:
  client:
    enabled: false
