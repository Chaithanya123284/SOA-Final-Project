server:
  port: 8082

spring:
  application:
    name: profile-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://careerlink:Password123!@cluster0.gmqul7w.mongodb.net/profiledb?appName=Cluster0}
      auto-index-creation: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
