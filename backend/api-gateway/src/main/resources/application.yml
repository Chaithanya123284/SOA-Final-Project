server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service Route
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        # Profile Service Route
        - id: profile-service-route
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/v1/profiles/**

        # Job Service Route
        - id: job-service-route
          uri: lb://JOB-SERVICE
          predicates:
            - Path=/api/v1/jobs/**

        # Application Service Route
        - id: application-service-route
          uri: lb://APPLICATION-SERVICE
          predicates:
            - Path=/api/v1/applications/**

jwt:
  secret: CareerLinkNetworksSuperSecretKeyForJWTSigningAndVerificationPurposeMustBeAtLeast256BitsLong!
  expiration: 86400000

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
